replicaCount: 3

image:
  repository: rajeshkosta/wanderlust-frontend
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "frontend-sa"

podAnnotations: {}

podLabels:
  app: frontend

podSecurityContext: {}

securityContext: {}

config:
  VITE_API_PATH: "/api"
  NODE_ENV: "production"

service:
  name: frontend-svc
  type: ClusterIP
  port: 80
  targetPort: 80


ingress:
  enabled: true
  className: nginx
  host: wanderlust.local


resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
