frontend:
  replicaCount: 3

  image:
    repository: rajeshkosta/wanderlust-frontend
    tag: "latest"
    pullPolicy: Always

  imagePullSecrets: []

  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: frontend-sa

  podAnnotations: {}

  podLabels:
    app: frontend

  podSecurityContext: {}

  securityContext: {}

  config:
    VITE_API_PATH: "/api"
    NODE_ENV: "production"

  service:
    name: frontend-svc
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    className: nginx
    host: prod.wanderlust.local

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 20
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  volumes: []

  volumeMounts: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

backend:
  replicaCount: 3

  image:
    repository: rajeshkosta/wanderlust-backend
    tag: "latest"
    pullPolicy: Always

  imagePullSecrets: []

  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: backend-sa

  podAnnotations: {}

  podLabels:
    app: backend

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  containerPort: 5000

  service:
    name: backend-svc
    type: ClusterIP
    port: 80
    targetPort: 5000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  startupProbe:
    httpGet:
      path: /
      port: 5000
    failureThreshold: 30
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: 5000
    initialDelaySeconds: 5
    periodSeconds: 5

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  nodeAffinity:
    enabled: true
    key: workload
    value: application

  tolerations: []

  initContainer:
    enabled: true
    image: busybox:1.36

  mongodb:
    host: wanderlust-mongodb.mongodb.svc.cluster.local
    port: 27017

  redis:
    host: wanderlust-redisdb-master.redisdb.svc.cluster.local
    port: 6379

  secret:
    MONGODB_URI: "mongodb://admin:admin123@mongodb.mongodb.svc.cluster.local:27017/test?authSource=admin"
    REDIS_URL: "redis://redisdb-master.redisdb.svc.cluster.local:6379"

  volumes:
    - name: app-storage
      emptyDir: {}

  volumeMounts:
    - name: app-storage
      mountPath: /data

  ingress:
    enabled: false
    className: nginx
