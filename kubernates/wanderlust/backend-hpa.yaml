apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wanderlust-hpa
  namespace: wanderlust

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend

  minReplicas: 2
  maxReplicas: 10

  behavior:

    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60

      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

      selectPolicy: Min

  metrics:

  # CPU Metrics
  - type: Resource
    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 50

  # Memory Metrics
  - type: Resource
    resource:
      name: memory

      target:
        type: Utilization
        averageUtilization: 70
