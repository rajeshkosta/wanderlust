apiVersion: v1
kind: ConfigMap

metadata:
  name: wanderlust-env
  namespace: wanderlust

data:

  # App Environment
  NODE_ENV: "production"
  PORT: "5000"

  # Frontend / Backend URLs
  FRONTEND_URL: "http://frontend"
  BACKEND_URL: "http://backend:5000"

  # Redis
  REDIS_URL: "redis://redis.database.svc.cluster.local:6379"
  REDIS_DB: "0"
  CACHE_TTL: "3600"
  ENABLE_CACHE: "true"

  # Logging
  LOG_LEVEL: "info"

  # Rate Limiting
  RATE_LIMIT_WINDOW: "15"

  RATE_LIMIT_MAX: "100"

  # Health Check
  HEALTH_PATH: "/health"

  # Cookie / Session
  COOKIE_EXPIRE: "7"

  # JWT
  JWT_EXPIRE: "7d"

  # Feature Flags
  ENABLE_SWAGGER: "false"
  ENABLE_METRICS: "true"
  ENABLE_CORS: "true"

