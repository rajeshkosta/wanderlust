apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: database

  labels:
    app: redis

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:

      nodeSelector:
        role: database

      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "database"
        effect: "NoSchedule"

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: role
                operator: In
                values:
                - database

      containers:
      - name: redis

        image: redis:7.0.5-alpine
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 6379

        args:
        - redis-server
        - --appendonly
        - "yes"
        - --maxmemory
        - "256mb"
        - --maxmemory-policy
        - allkeys-lru

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 10

        volumeMounts:
        - name: redis-storage
          mountPath: /data

      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc

---
apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: database

spec:
  type: ClusterIP

  selector:
    app: redis

  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
