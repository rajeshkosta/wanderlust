version: "3.8"

services:

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - wanderlust

  frontend:
    container_name: frontend
    build:
      context: ./Application/frontend
    depends_on:
      - backend
    networks:
      - wanderlust

  backend:
    container_name: backend
    build:
      context: ./Application/backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/wanderlust
      REDIS_URL: redis://redis:6379
      PORT: 5000
    depends_on:
      - mongodb
      - redis
    networks:
      - wanderlust

  mongodb:
    container_name: mongo
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - ./Application/backend/wanderlust_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - wanderlust

  redis:
    container_name: redis
    image: redis:7.0.5-alpine
    restart: unless-stopped
    depends_on:
      - mongodb
    networks:
      - wanderlust

volumes:
  mongo_config:

networks:
  wanderlust:
    driver: bridge
